<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Info Terkini SMPN 2 Ayah</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        Babel.registerPreset('react-classic', {
            presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
        });
    </script>

    <!-- FIREBASE COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #root { height: 100%; }
        
        .light-scrollbar::-webkit-scrollbar { width: 4px; }
        .light-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .light-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .light-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .format-rte-preview-light ul { list-style-type: disc; margin-left: 1.5rem; color: #374151; }
        .format-rte-preview-light ol { list-style-type: decimal; margin-left: 1.5rem; color: #374151; }
        .format-rte-preview-light b { font-weight: bold; color: #374151; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="env,react-classic">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyAbZcPJHnaARMEjg23iwViwtfzjwb23vKg",
            authDomain: "project-umum-a58eb.firebaseapp.com",
            projectId: "project-umum-a58eb",
            storageBucket: "project-umum-a58eb.firebasestorage.app",
            messagingSenderId: "778774567319",
            appId: "1:778774567319:web:1c2b35335ce1c3550bccd2"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const ChevronLeft = ({size, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="15 18 9 12 15 6"/></svg>;
        const ChevronRight = ({size, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"/></svg>;
        const FileText = ({size, className}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;

        function App() {
          const [announcements, setAnnouncements] = useState([]);
          const [currentInfoIndex, setCurrentInfoIndex] = useState(0);
          const [isLoadingData, setIsLoadingData] = useState(true);
          const [selectedImage, setSelectedImage] = useState(null);
          const [isZoomed, setIsZoomed] = useState(false);
          
          const [touchStart, setTouchStart] = useState(null);
          const [touchEnd, setTouchEnd] = useState(null);
          const minSwipeDistance = 50;

          const appId = 'satelit-sekolah-app';

          useEffect(() => {
            const initFirebaseData = async () => {
                try {
                    await auth.signInAnonymously();
                    const infoRef = db.collection(`artifacts/${appId}/public/data/info`);
                    infoRef.onSnapshot((snapshot) => {
                        let dataInfo = [];
                        snapshot.forEach(doc => dataInfo.push({ id: doc.id, ...doc.data() }));
                        dataInfo.sort((a, b) => b.timestamp - a.timestamp);
                        setAnnouncements(dataInfo);
                        setIsLoadingData(false);
                    });
                } catch (error) {
                    setIsLoadingData(false);
                }
            };
            initFirebaseData();
          }, []);

          const nextInfo = () => {
            if (announcements.length === 0) return;
            setCurrentInfoIndex((prev) => (prev === announcements.length - 1 ? 0 : prev + 1));
          };

          const prevInfo = () => {
            if (announcements.length === 0) return;
            setCurrentInfoIndex((prev) => (prev === 0 ? announcements.length - 1 : prev - 1));
          };

          const onTouchStartEvent = (e) => { setTouchEnd(null); setTouchStart(e.targetTouches[0].clientX); };
          const onTouchMoveEvent = (e) => setTouchEnd(e.targetTouches[0].clientX);
          const onTouchEndEvent = () => {
            if (!touchStart || !touchEnd) return;
            const distance = touchStart - touchEnd;
            if (distance > minSwipeDistance) nextInfo();
            if (distance < -minSwipeDistance) prevInfo();
          };

          const formatTanggal = (tanggalSistem) => {
            if (!tanggalSistem || tanggalSistem === "-") return "-";
            const dateObj = new Date(tanggalSistem);
            if (isNaN(dateObj.getTime())) return tanggalSistem; 
            return dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
          };

          return (
            <div className="w-full h-full bg-[#0b0e14] p-4 sm:p-6 relative overflow-hidden flex flex-col items-center justify-center">
              {/* EFEK NEON BACKGROUND */}
              <div className="absolute top-[-10%] left-[-10%] w-64 h-64 bg-indigo-600/30 rounded-full blur-[80px] pointer-events-none"></div>
              <div className="absolute bottom-[-10%] right-[-10%] w-64 h-64 bg-cyan-600/20 rounded-full blur-[80px] pointer-events-none"></div>

              <div className="flex-1 flex items-center justify-center relative z-10 pb-4 w-full h-full">
                <div 
                  className="bg-white w-full max-w-sm h-full max-h-[800px] rounded-3xl shadow-[0_0_30px_rgba(255,255,255,0.05)] overflow-hidden border border-gray-200 flex flex-col"
                  onTouchStart={onTouchStartEvent} onTouchMove={onTouchMoveEvent} onTouchEnd={onTouchEndEvent}
                >
                  {/* KOP SURAT */}
                  <div className="bg-white text-gray-900 px-4 pt-5 pb-3 flex items-center justify-between border-b-[3px] border-double border-gray-800 shrink-0">
                    <img src="./kebumen.png" alt="Kebumen" className="w-10 h-10 object-contain shrink-0" onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/100x100/f8fafc/cbd5e1?text=KBM'; }} />
                    <div className="flex-1 flex flex-col items-center justify-center text-center px-2 gap-0">
                      <h2 className="text-lg font-bold text-gray-900 leading-tight">INFO TERKINI</h2>
                      <p className="text-lg font-bold text-gray-900 leading-tight">SMP NEGERI 2 AYAH</p>
                    </div>
                    <img src="./smpn2ayah.png" alt="SMPN 2 Ayah" className="w-10 h-10 object-contain shrink-0" onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/100x100/f8fafc/cbd5e1?text=SMP'; }} />
                  </div>
                  
                  {/* ISI PENGUMUMAN */}
                  <div className="p-3 sm:p-4 relative flex-1 flex flex-col justify-between bg-white overflow-hidden">
                    {isLoadingData ? (
                      <div className="flex flex-col items-center justify-center text-indigo-600 h-full py-10">
                        <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mb-2"></div>
                        <p className="text-sm font-medium animate-pulse">Memuat Info...</p>
                      </div>
                    ) : announcements.length > 0 ? (
                      <div className="flex flex-col h-full overflow-hidden">
                        <div className="transition-all duration-300 ease-in-out w-full px-1 flex-1 overflow-y-auto light-scrollbar pb-2">
                          <h3 className="text-lg font-bold text-gray-900 mb-3 border-b border-gray-200 pb-2 leading-tight text-center">
                            {announcements[currentInfoIndex]?.judul}
                          </h3>
                          <div 
                             className="text-gray-700 text-sm leading-relaxed format-rte-preview-light"
                             dangerouslySetInnerHTML={{ __html: announcements[currentInfoIndex]?.konten }}
                          />
                          {announcements[currentInfoIndex]?.lampiranUrl && (
                             <div className="mt-4 border-t border-gray-100 pt-3">
                                {announcements[currentInfoIndex].lampiranTipe === 'image' ? (
                                    <div className="relative group">
                                        <img src={announcements[currentInfoIndex].lampiranUrl} alt="Lampiran Info" className="w-full h-auto rounded-lg shadow-sm cursor-pointer hover:opacity-90 transition-opacity" onClick={() => { setSelectedImage(announcements[currentInfoIndex].lampiranUrl); setIsZoomed(false); }}/>
                                        <div className="absolute bottom-2 right-2 bg-black/60 text-white text-[9px] px-2 py-1 rounded flex items-center gap-1 pointer-events-none">
                                            Ketuk Perbesar
                                        </div>
                                    </div>
                                ) : (
                                    <a href={announcements[currentInfoIndex].lampiranUrl} target="_blank" rel="noreferrer" className="inline-flex items-center gap-2 text-xs font-bold text-indigo-700 bg-indigo-50 p-2.5 rounded-lg hover:bg-indigo-100 transition-colors border border-indigo-100">
                                        <FileText size={16} /> Buka Lampiran PDF
                                    </a>
                                )}
                             </div>
                          )}
                        </div>

                        {/* BAGIAN TANGGAL, STEMPEL & PANAH */}
                        <div className="mt-4 flex justify-between items-end border-t border-gray-100 pt-3 shrink-0">
                          <button onClick={prevInfo} className="p-2 bg-white rounded-full shadow-sm hover:bg-gray-50 text-indigo-600 border border-gray-200 transition-all hover:scale-110 shrink-0 self-center">
                            <ChevronLeft size={20} />
                          </button>

                          <div className="flex flex-col items-center flex-1 mx-2">
                            <p className="text-[10px] text-gray-500 font-semibold italic text-center leading-none">
                              {formatTanggal(announcements[currentInfoIndex]?.tanggal)}
                            </p>
                            <img src="./stempel.png" alt="Stempel Resmi" className="w-24 h-24 object-contain opacity-90 mix-blend-multiply drop-shadow-sm -mt-1" onError={(e) => { e.target.style.display = 'none'; }} />
                          </div>

                          <button onClick={nextInfo} className="p-2 bg-white rounded-full shadow-sm hover:bg-gray-50 text-indigo-600 border border-gray-200 transition-all hover:scale-110 shrink-0 self-center">
                            <ChevronRight size={20} />
                          </button>
                        </div>
                      </div>
                    ) : (
                      <p className="text-center text-gray-400 font-medium py-10">Belum ada info terbaru.</p>
                    )}
                  </div>
                  
                  {/* INDIKATOR TITIK SLIDE */}
                  <div className="flex justify-center pb-4 pt-1 gap-1.5 bg-white relative z-10 shrink-0 border-t border-gray-50">
                    {!isLoadingData && announcements.length > 0 && announcements.map((_, idx) => (
                      <div key={idx} className={`h-2 rounded-full transition-all duration-300 ${idx === currentInfoIndex ? 'w-6 bg-indigo-600' : 'w-2 bg-gray-300'}`} />
                    ))}
                  </div>
                </div>
              </div>

              {/* MODAL POPUP GAMBAR LAYAR PENUH */}
              {selectedImage && (
                  <div className="absolute inset-0 z-[100] bg-black/95 flex flex-col items-center justify-center backdrop-blur-sm">
                      <button onClick={() => setSelectedImage(null)} className="absolute top-6 right-6 p-2.5 bg-red-500/20 hover:bg-red-500/40 border border-red-500/50 rounded-full text-red-400 transition-all z-[110]">
                          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                      </button>
                      <div className={`w-full h-full overflow-auto light-scrollbar ${isZoomed ? 'block' : 'flex items-center justify-center'} p-2`}>
                          <img src={selectedImage} alt="Pratinjau Penuh" onClick={() => setIsZoomed(!isZoomed)} className={`transition-all duration-300 cursor-pointer ${isZoomed ? 'w-[200%] sm:w-[250%] max-w-none mt-10 ml-auto mr-auto object-contain' : 'max-w-full max-h-[85vh] object-contain'}`}/>
                      </div>
                      <div className="absolute bottom-8 bg-[#151822]/80 border border-indigo-500/30 text-cyan-300 text-xs font-bold px-5 py-2.5 rounded-full backdrop-blur-md pointer-events-none shadow-[0_0_15px_rgba(0,0,0,0.5)]">
                          Ketuk gambar untuk {isZoomed ? 'Mengecilkan' : 'Memperbesar'} (Zoom)
                      </div>
                  </div>
              )}
            </div>
          );
        }
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
